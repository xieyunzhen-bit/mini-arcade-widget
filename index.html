<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BMO's Adventure Time Arcade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="bg-clouds"></div>

    <div class="bmo-cabinet">
        <div class="bmo-top-banner">
            <span class="bmo-logo">B M O</span>
            <span class="sub-text">ADVENTURE TIME ARCADE</span>
        </div>

        <div class="screen-bezel">
            <div class="screen-header">
                <span id="game-title">SELECT A GAME</span>
                <span id="score-display">SCORE: 00</span>
            </div>
            <canvas id="game-canvas" width="320" height="320"></canvas>
            <div class="screen-instructions" id="instructions">Press a button to play!</div>
        </div>

        <div class="controls-section">
            <div class="game-select-buttons">
                <button id="btn-snake" class="bmo-btn btn-yellow">
                    <span class="btn-icon">🐶</span> JAKE (SNAKE)
                </button>
                <button id="btn-breakout" class="bmo-btn btn-blue">
                    <span class="btn-icon">🍬</span> CANDY BREAKOUT
                </button>
                <button id="btn-flappy" class="bmo-btn btn-red">
                    <span class="btn-icon">⚔️</span> FLAPPY FINN
                </button>
            </div>

            <div class="dpad-and-actions">
                <div class="dpad-container">
                    <div class="dpad-cross">
                        <button id="ctrl-up" class="dpad-btn up">▲</button>
                        <button id="ctrl-left" class="dpad-btn left">◀</button>
                        <div class="dpad-center"></div>
                        <button id="ctrl-right" class="dpad-btn right">▶</button>
                        <button id="ctrl-down" class="dpad-btn down">▼</button>
                    </div>
                </div>

                <div class="action-buttons-container">
                    <button id="ctrl-action" class="action-round-btn">ACTION<br><small>(SPACE)</small></button>
                    <button id="btn-reset" class="action-round-btn reset-btn">RESET</button>
                </div>
            </div>
        </div>
    </div>

    <script src="arcade.js"></script>
</body>
</html>
