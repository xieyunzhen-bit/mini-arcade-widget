<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>BMO's Adventure Time Arcade</title>
    <!-- Pixel font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 16px 8px;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
            background: linear-gradient(180deg, #7ad1f5 0%, #b2e6fd 58%, #76c043 58%, #5ba52a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Cartoon Clouds */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 58%;
            pointer-events: none;
            background-image: 
                radial-gradient(ellipse at 15% 20%, #ffffff 0%, #ffffff 50px, transparent 55px),
                radial-gradient(ellipse at 23% 22%, #ffffff 0%, #ffffff 35px, transparent 40px),
                radial-gradient(ellipse at 78% 15%, #ffffff 0%, #ffffff 60px, transparent 65px),
                radial-gradient(ellipse at 86% 18%, #ffffff 0%, #ffffff 40px, transparent 45px);
            opacity: 0.85;
            z-index: 0;
        }

        /* BMO CABINET */
        .bmo-arcade {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 360px;
            background: #50b3a2; /* BMO Teal */
            border: 5px solid #286358;
            border-radius: 28px;
            padding: 16px;
            box-shadow: 
                0 14px 0 #286358, 
                0 22px 25px rgba(0,0,0,0.35),
                inset 0 4px 6px rgba(255,255,255,0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Header */
        .bmo-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
        }

        .bmo-title {
            color: #ffd43f;
            font-size: 1.5rem;
            letter-spacing: 6px;
            text-shadow: 2px 2px 0 #18443c, 4px 4px 0 #000;
        }

        .bmo-subtitle {
            font-size: 0.52rem;
            color: #e5fbf7;
            letter-spacing: 1px;
            margin-top: 4px;
            text-shadow: 1px 1px 0 #18443c;
        }

        /* Screen Frame */
        .screen-bezel {
            width: 100%;
            background: #24584f;
            border: 4px solid #1a423b;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.5);
        }

        .screen-top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            font-size: 0.55rem;
            color: #6cf9d8;
            margin-bottom: 8px;
            padding: 0 4px;
            text-shadow: 0 0 5px rgba(108, 249, 216, 0.7);
        }

        #game-canvas {
            background: #111a18;
            border: 3px solid #14352f;
            border-radius: 8px;
            display: block;
            width: 300px;
            height: 300px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.6);
            cursor: pointer;
        }

        .screen-help {
            margin-top: 6px;
            font-size: 0.5rem;
            color: #a4ecd9;
            text-align: center;
            min-height: 14px;
            line-height: 1.3;
        }

        /* Buttons Section */
        .controls-area {
            width: 100%;
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .game-tab-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.62rem;
            padding: 8px 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.08s, box-shadow 0.08s;
        }

        .game-tab-btn:active {
            transform: translateY(3px);
        }

        .tab-yellow {
            background: #fbc531;
            color: #432e04;
            box-shadow: 0 4px 0 #a98017;
        }
        .tab-yellow:active { box-shadow: 0 1px 0 #a98017; }

        .tab-blue {
            background: #48dbfb;
            color: #0b4555;
            box-shadow: 0 4px 0 #1b8ba2;
        }
        .tab-blue:active { box-shadow: 0 1px 0 #1b8ba2; }

        .tab-red {
            background: #ff6b6b;
            color: #4b0e0e;
            box-shadow: 0 4px 0 #b33939;
        }
        .tab-red:active { box-shadow: 0 1px 0 #b33939; }

        /* D-PAD & ACTION */
        .bottom-hardware {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            background: #429f8f;
            border-radius: 16px;
            border: 3px solid #286358;
        }

        .dpad {
            position: relative;
            width: 84px;
            height: 84px;
        }

        .dpad-key {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #ffd32a;
            border: 2px solid #94790e;
            color: #554402;
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 0 #7b650a;
            border-radius: 4px;
            padding: 0;
        }
        .dpad-key:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #7b650a;
        }

        .dpad-key.up    { top: 0; left: 28px; }
        .dpad-key.down  { bottom: 0; left: 28px; }
        .dpad-key.left  { top: 28px; left: 0; }
        .dpad-key.right { top: 28px; right: 0; }
        .dpad-core      { position: absolute; top: 28px; left: 28px; width: 28px; height: 28px; background: #ffd32a; }

        .action-btns {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .round-button {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.52rem;
            padding: 8px 10px;
            border-radius: 20px;
            border: 2px solid #14352f;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
            line-height: 1.2;
        }
        .round-button:active {
            transform: translateY(2px);
        }

        #action-btn {
            background: #1dd1a1;
            color: #053b2c;
            box-shadow: 0 4px 0 #108566;
        }
        #action-btn:active { box-shadow: 0 1px 0 #108566; }

        #reset-btn {
            background: #ee5253;
            color: #4b0e0e;
            box-shadow: 0 4px 0 #9b2829;
        }
        #reset-btn:active { box-shadow: 0 1px 0 #9b2829; }
    </style>
</head>
<body>
    <div class="clouds"></div>

    <div class="bmo-arcade">
        <div class="bmo-header">
            <span class="bmo-title">B M O</span>
            <span class="bmo-subtitle">ADVENTURE TIME ARCADE</span>
        </div>

        <div class="screen-bezel">
            <div class="screen-top-bar">
                <span id="title-text">SELECT GAME</span>
                <span id="score-text">SCORE: 00</span>
            </div>
            <canvas id="game-canvas" width="300" height="300"></canvas>
            <div class="screen-help" id="help-text">Tap a game below to play!</div>
        </div>

        <div class="controls-area">
            <div class="game-menu-buttons">
                <button id="btn-snake" class="game-tab-btn tab-yellow">
                    <span>ðŸ¶</span> JAKE (SNAKE)
                </button>
                <button id="btn-breakout" class="game-tab-btn tab-blue">
                    <span>ðŸ¬</span> CANDY BREAKOUT
                </button>
                <button id="btn-flappy" class="game-tab-btn tab-red">
                    <span>âš”ï¸</span> FLAPPY FINN
                </button>
            </div>

            <div class="bottom-hardware">
                <div class="dpad">
                    <button id="pad-up" class="dpad-key up">â–²</button>
                    <button id="pad-left" class="dpad-key left">â—€</button>
                    <div class="dpad-core"></div>
                    <button id="pad-right" class="dpad-key right">â–¶</button>
                    <button id="pad-down" class="dpad-key down">â–¼</button>
                </div>

                <div class="action-btns">
                    <button id="action-btn" class="round-button">ACTION<br><small>(SPACE)</small></button>
                    <button id="reset-btn" class="round-button">RESET</button>
                </div>
            </div>
        </div>
    </div>

    <script>
    (() => {
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const W = canvas.width;
        const H = canvas.height;

        const titleText = document.getElementById('title-text');
        const scoreText = document.getElementById('score-text');
        const helpText = document.getElementById('help-text');

        const btnSnake = document.getElementById('btn-snake');
        const btnBreakout = document.getElementById('btn-breakout');
        const btnFlappy = document.getElementById('btn-flappy');
        const btnReset = document.getElementById('reset-btn');
        const btnAction = document.getElementById('action-btn');

        const padUp = document.getElementById('pad-up');
        const padDown = document.getElementById('pad-down');
        const padLeft = document.getElementById('pad-left');
        const padRight = document.getElementById('pad-right');

        let currentGame = 'idle'; // 'idle', 'snake', 'breakout', 'flappy'
        let score = 0;

        function setScore(val) {
            score = val;
            scoreText.textContent = `SCORE: ${score.toString().padStart(2, '0')}`;
        }

        // --- RETRO SOUND SYNTHESIZER ---
        const audioCtx = window.AudioContext ? new AudioContext() : null;
        function playBeep(freq, type = 'sine', duration = 0.08) {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        // ==========================================
        // 0. BMO IDLE SCREEN
        // ==========================================
        let bmoTimer = 0;
        const bmoIdle = {
            update(dt) {
                bmoTimer += dt;
                if (bmoTimer > 4) bmoTimer = 0;
            },
            draw() {
                // Soft teal screen
                ctx.fillStyle = '#65d5ba';
                ctx.fillRect(0, 0, W, H);

                ctx.fillStyle = '#143c33';
                const blink = bmoTimer > 3.7;

                if (blink) {
                    ctx.fillRect(80, 115, 35, 6);
                    ctx.fillRect(185, 115, 35, 6);
                } else {
                    ctx.beginPath();
                    ctx.arc(95, 115, 16, 0, Math.PI * 2);
                    ctx.arc(205, 115, 16, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Smiling mouth
                ctx.beginPath();
                ctx.lineWidth = 5;
                ctx.strokeStyle = '#143c33';
                ctx.arc(150, 140, 24, 0.1 * Math.PI, 0.9 * Math.PI, false);
                ctx.stroke();

                // Rosy cheeks
                ctx.fillStyle = '#9fe9d8';
                ctx.beginPath();
                ctx.arc(65, 135, 10, 0, Math.PI * 2);
                ctx.arc(235, 135, 10, 0, Math.PI * 2);
                ctx.fill();

                // Welcome message
                ctx.fillStyle = '#143c33';
                ctx.font = '9px "Press Start 2P", monospace';
                ctx.textAlign = 'center';
                ctx.fillText('HI! I AM BMO!', W / 2, 215);
                ctx.fillText('PICK A GAME BELOW!', W / 2, 238);
            }
        };

        // ==========================================
        // 1. JAKE THE DOG (SNAKE)
        // ==========================================
        const snakeGame = {
            grid: 20,
            cols: 15,
            rows: 15,
            snake: [],
            dir: { x: 1, y: 0 },
            nextDir: { x: 1, y: 0 },
            food: { x: 5, y: 5 },
            timer: 0,
            speed: 0.13,
            init() {
                this.snake = [
                    { x: 5, y: 7 },
                    { x: 4, y: 7 },
                    { x: 3, y: 7 }
                ];
                this.dir = { x: 1, y: 0 };
                this.nextDir = { x: 1, y: 0 };
                this.spawnFood();
                setScore(0);
                helpText.textContent = 'Arrow Keys / D-Pad to stretch Jake!';
            },
            spawnFood() {
                this.food = {
                    x: Math.floor(Math.random() * this.cols),
                    y: Math.floor(Math.random() * this.rows)
                };
            },
            input(d) {
                if (d === 'UP' && this.dir.y === 0) this.nextDir = { x: 0, y: -1 };
                if (d === 'DOWN' && this.dir.y === 0) this.nextDir = { x: 0, y: 1 };
                if (d === 'LEFT' && this.dir.x === 0) this.nextDir = { x: -1, y: 0 };
                if (d === 'RIGHT' && this.dir.x === 0) this.nextDir = { x: 1, y: 0 };
            },
            update(dt) {
                this.timer += dt;
                if (this.timer >= this.speed) {
                    this.timer = 0;
                    this.dir = this.nextDir;
                    const head = {
                        x: (this.snake[0].x + this.dir.x + this.cols) % this.cols,
                        y: (this.snake[0].y + this.dir.y + this.rows) % this.rows
                    };

                    // Crash into self
                    if (this.snake.some(s => s.x === head.x && s.y === head.y)) {
                        playBeep(140, 'sawtooth', 0.2);
                        this.init();
                        return;
                    }

                    this.snake.unshift(head);

                    // Eat food
                    if (head.x === this.food.x && head.y === this.food.y) {
                        playBeep(520, 'square', 0.1);
                        setScore(score + 10);
                        this.spawnFood();
                    } else {
                        this.snake.pop();
                    }
                }
            },
            draw() {
                // Land of Ooo grass
                ctx.fillStyle = '#6ab04c';
                ctx.fillRect(0, 0, W, H);

                // Bacon Pancakes food
                const fx = this.food.x * this.grid;
                const fy = this.food.y * this.grid;
                ctx.fillStyle = '#f39c12';
                ctx.beginPath();
                ctx.ellipse(fx + 10, fy + 11, 7, 5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#f1c40f'; // Butter
                ctx.fillRect(fx + 8, fy + 5, 4, 3);

                // Jake Segments
                this.snake.forEach((seg, i) => {
                    const sx = seg.x * this.grid;
                    const sy = seg.y * this.grid;

                    ctx.fillStyle = '#f9ca24'; // Jake Golden Yellow
                    ctx.fillRect(sx + 1, sy + 1, 18, 18);

                    if (i === 0) {
                        // Big round Jake eyes
                        ctx.fillStyle = '#ffffff';
                        ctx.beginPath();
                        ctx.arc(sx + 6, sy + 6, 4, 0, Math.PI * 2);
                        ctx.arc(sx + 14, sy + 6, 4, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = '#000000';
                        ctx.beginPath();
                        ctx.arc(sx + 6 + this.dir.x, sy + 6 + this.dir.y, 2, 0, Math.PI * 2);
                        ctx.arc(sx + 14 + this.dir.x, sy + 6 + this.dir.y, 2, 0, Math.PI * 2);
                        ctx.fill();

                        // Jowls
                        ctx.fillStyle = '#f6b93b';
                        ctx.beginPath();
                        ctx.ellipse(sx + 10, sy + 13, 5, 3, 0, 0, Math.PI * 2);
                        ctx.fill();
                    }
                });
            }
        };

        // ==========================================
        // 2. CANDY KINGDOM BREAKOUT
        // ==========================================
        const breakoutGame = {
            paddle: { x: 110, y: 275, w: 75, h: 10, speed: 280 },
            ball: { x: 150, y: 200, r: 6, vx: 150, vy: -150 },
            bricks: [],
            colors: ['#ff6b81', '#70a1ff', '#2ed573', '#ffa502', '#eccc68'],
            left: false,
            right: false,
            init() {
                this.paddle.x = W / 2 - this.paddle.w / 2;
                this.ball.x = W / 2;
                this.ball.y = 200;
                this.ball.vx = (Math.random() > 0.5 ? 1 : -1) * 140;
                this.ball.vy = -160;

                this.bricks = [];
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 6; c++) {
                        this.bricks.push({
                            x: 6 + c * 49,
                            y: 25 + r * 18,
                            w: 43,
                            h: 13,
                            color: this.colors[r],
                            alive: true
                        });
                    }
                }
                setScore(0);
                helpText.textContent = 'â—€ â–¶ Arrows or D-Pad to move blade!';
            },
            input(d, state) {
                if (d === 'LEFT') this.left = state;
                if (d === 'RIGHT') this.right = state;
            },
            update(dt) {
                if (this.left) this.paddle.x -= this.paddle.speed * dt;
                if (this.right) this.paddle.x += this.paddle.speed * dt;
                if (this.paddle.x < 0) this.paddle.x = 0;
                if (this.paddle.x + this.paddle.w > W) this.paddle.x = W - this.paddle.w;

                this.ball.x += this.ball.vx * dt;
                this.ball.y += this.ball.vy * dt;

                // Walls
                if (this.ball.x - this.ball.r <= 0) {
                    this.ball.x = this.ball.r;
                    this.ball.vx *= -1;
                    playBeep(300);
                }
                if (this.ball.x + this.ball.r >= W) {
                    this.ball.x = W - this.ball.r;
                    this.ball.vx *= -1;
                    playBeep(300);
                }
                if (this.ball.y - this.ball.r <= 0) {
                    this.ball.y = this.ball.r;
                    this.ball.vy *= -1;
                    playBeep(300);
                }

                // Drop bottom
                if (this.ball.y - this.ball.r > H) {
                    playBeep(120, 'sawtooth', 0.25);
                    this.init();
                    return;
                }

                // Paddle collision
                const p = this.paddle;
                if (
                    this.ball.y + this.ball.r >= p.y &&
                    this.ball.y - this.ball.r <= p.y + p.h &&
                    this.ball.x >= p.x &&
                    this.ball.x <= p.x + p.w
                ) {
                    this.ball.vy = -Math.abs(this.ball.vy);
                    const offset = (this.ball.x - (p.x + p.w / 2)) / (p.w / 2);
                    this.ball.vx = offset * 200;
                    playBeep(440, 'triangle');
                }

                // Bricks collision
                for (const b of this.bricks) {
                    if (!b.alive) continue;
                    if (
                        this.ball.x + this.ball.r > b.x &&
                        this.ball.x - this.ball.r < b.x + b.w &&
                        this.ball.y + this.ball.r > b.y &&
                        this.ball.y - this.ball.r < b.y + b.h
                    ) {
                        b.alive = false;
                        this.ball.vy *= -1;
                        playBeep(650, 'square');
                        setScore(score + 5);
                        break;
                    }
                }
            },
            draw() {
                // Castle wall background
                ctx.fillStyle = '#2f3640';
                ctx.fillRect(0, 0, W, H);

                // Bricks
                for (const b of this.bricks) {
                    if (!b.alive) continue;
                    ctx.fillStyle = b.color;
                    ctx.fillRect(b.x, b.y, b.w, b.h);
                    ctx.fillStyle = 'rgba(255,255,255,0.4)';
                    ctx.fillRect(b.x + 2, b.y + 2, b.w - 4, 3);
                }

                // Finn Golden Sword Paddle
                ctx.fillStyle = '#fbc531';
                ctx.fillRect(this.paddle.x, this.paddle.y, this.paddle.w, this.paddle.h);
                ctx.fillStyle = '#4cd137'; // Sword grip
                ctx.fillRect(this.paddle.x + this.paddle.w / 2 - 8, this.paddle.y + 3, 16, 4);

                // Glowing Ball
                ctx.fillStyle = '#ff4757';
                ctx.beginPath();
                ctx.arc(this.ball.x, this.ball.y, this.ball.r, 0, Math.PI * 2);
                ctx.fill();
            }
        };

        // ==========================================
        // 3. FLAPPY FINN (SUPER SMOOTH & FULLY WORKING!)
        // ==========================================
        const flappyGame = {
            finn: { x: 45, y: 130, w: 24, h: 24, vy: 0 },
            gravity: 520,
            flapForce: -190,
            pipes: [],
            pipeTimer: 0,
            gap: 92,
            speed: 110,
            init() {
                this.finn = { x: 45, y: 130, w: 24, h: 24, vy: 0 };
                this.pipes = [];
                this.pipeTimer = 0;
                setScore(0);
                helpText.textContent = 'SPACE / TAP / ACTION to make Finn flap!';
            },
            flap() {
                this.finn.vy = this.flapForce;
                playBeep(450, 'sine', 0.08);
            },
            update(dt) {
                // Gravity
                this.finn.vy += this.gravity * dt;
                this.finn.y += this.finn.vy * dt;

                // Spawn Peppermint Pillars
                this.pipeTimer += dt;
                if (this.pipeTimer >= 1.7) {
                    this.pipeTimer = 0;
                    const minH = 35;
                    const maxH = H - this.gap - minH;
                    const topH = Math.floor(minH + Math.random() * (maxH - minH));
                    this.pipes.push({
                        x: W,
                        w: 40,
                        topH: topH,
                        botY: topH + this.gap,
                        scored: false
                    });
                }

                // Move & collide
                for (let i = this.pipes.length - 1; i >= 0; i--) {
                    const p = this.pipes[i];
                    p.x -= this.speed * dt;

                    // Score
                    if (!p.scored && p.x + p.w < this.finn.x) {
                        p.scored = true;
                        setScore(score + 1);
                        playBeep(700, 'square', 0.1);
                    }

                    // Collision
                    const fx = this.finn.x;
                    const fy = this.finn.y;
                    const fw = this.finn.w;
                    const fh = this.finn.h;

                    if (fx + fw > p.x && fx < p.x + p.w) {
                        if (fy < p.topH || fy + fh > p.botY) {
                            playBeep(130, 'sawtooth', 0.2);
                            this.init();
                            return;
                        }
                    }

                    if (p.x + p.w < 0) this.pipes.splice(i, 1);
                }

                // Ceil / Floor hit
                if (this.finn.y + this.finn.h >= H || this.finn.y < 0) {
                    playBeep(130, 'sawtooth', 0.2);
                    this.init();
                }
            },
            draw() {
                // Sky
                ctx.fillStyle = '#70a1ff';
                ctx.fillRect(0, 0, W, H);

                // Fluffy clouds
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(70, 45, 18, 0, Math.PI * 2);
                ctx.arc(95, 45, 24, 0, Math.PI * 2);
                ctx.arc(120, 45, 16, 0, Math.PI * 2);
                ctx.fill();

                // Draw Peppermint candy pipes
                for (const p of this.pipes) {
                    // Top pipe
                    ctx.fillStyle = '#ff4757';
                    ctx.fillRect(p.x, 0, p.w, p.topH);
                    ctx.fillStyle = '#ffffff';
                    for (let y = 0; y < p.topH; y += 16) {
                        ctx.fillRect(p.x, y, p.w, 8);
                    }
                    ctx.strokeStyle = '#2f3542';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(p.x, 0, p.w, p.topH);

                    // Bottom pipe
                    const botH = H - p.botY;
                    ctx.fillStyle = '#ff4757';
                    ctx.fillRect(p.x, p.botY, p.w, botH);
                    ctx.fillStyle = '#ffffff';
                    for (let y = p.botY; y < H; y += 16) {
                        ctx.fillRect(p.x, y, p.w, 8);
                    }
                    ctx.strokeRect(p.x, p.botY, p.w, botH);
                }

                // DRAW FINN THE HUMAN SPRITE
                const fx = this.finn.x;
                const fy = this.finn.y;

                // Green Backpack
                ctx.fillStyle = '#2ed573';
                ctx.fillRect(fx - 4, fy + 7, 5, 11);

                // White Hat
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(fx, fy, 22, 22);
                // Bear ears
                ctx.fillRect(fx + 2, fy - 3, 5, 4);
                ctx.fillRect(fx + 15, fy - 3, 5, 4);

                // Face hole
                ctx.fillStyle = '#ffc085';
                ctx.fillRect(fx + 5, fy + 5, 14, 11);

                // Eyes & Smile
                ctx.fillStyle = '#1e272e';
                ctx.fillRect(fx + 9, fy + 8, 2, 3);
                ctx.fillRect(fx + 15, fy + 8, 2, 3);
                ctx.fillRect(fx + 11, fy + 13, 4, 1);

                // Blue shirt
                ctx.fillStyle = '#3742fa';
                ctx.fillRect(fx + 3, fy + 20, 16, 4);
            }
        };

        // ==========================================
        // ROUTING & USER INPUT
        // ==========================================
        function pickGame(name) {
            playBeep(350, 'triangle', 0.05);
            currentGame = name;
            if (name === 'snake') {
                titleText.textContent = 'JAKE (SNAKE)';
                snakeGame.init();
            } else if (name === 'breakout') {
                titleText.textContent = 'CANDY BREAKOUT';
                breakoutGame.init();
            } else if (name === 'flappy') {
                titleText.textContent = 'FLAPPY FINN';
                flappyGame.init();
            }
        }

        btnSnake.addEventListener('click', () => pickGame('snake'));
        btnBreakout.addEventListener('click', () => pickGame('breakout'));
        btnFlappy.addEventListener('click', () => pickGame('flappy'));

        btnReset.addEventListener('click', () => {
            playBeep(200, 'square', 0.08);
            if (currentGame === 'snake') snakeGame.init();
            if (currentGame === 'breakout') breakoutGame.init();
            if (currentGame === 'flappy') flappyGame.init();
        });

        // ACTION BUTTON & SCREEN CLICK = FLAP
        function doAction() {
            if (currentGame === 'flappy') flappyGame.flap();
        }
        btnAction.addEventListener('pointerdown', doAction);
        canvas.addEventListener('pointerdown', doAction);

        // D-PAD CONTROLS
        padUp.addEventListener('pointerdown', () => {
            if (currentGame === 'snake') snakeGame.input('UP');
            if (currentGame === 'flappy') flappyGame.flap();
        });
        padDown.addEventListener('pointerdown', () => {
            if (currentGame === 'snake') snakeGame.input('DOWN');
        });
        padLeft.addEventListener('pointerdown', () => {
            if (currentGame === 'snake') snakeGame.input('LEFT');
            if (currentGame === 'breakout') breakoutGame.input('LEFT', true);
        });
        padLeft.addEventListener('pointerup', () => {
            if (currentGame === 'breakout') breakoutGame.input('LEFT', false);
        });
        padRight.addEventListener('pointerdown', () => {
            if (currentGame === 'snake') snakeGame.input('RIGHT');
            if (currentGame === 'breakout') breakoutGame.input('RIGHT', true);
        });
        padRight.addEventListener('pointerup', () => {
            if (currentGame === 'breakout') breakoutGame.input('RIGHT', false);
        });

        // KEYBOARD
        window.addEventListener('keydown', e => {
            if (e.repeat) return;
            if (currentGame === 'snake') {
                if (e.key === 'ArrowUp' || e.key === 'w') snakeGame.input('UP');
                if (e.key === 'ArrowDown' || e.key === 's') snakeGame.input('DOWN');
                if (e.key === 'ArrowLeft' || e.key === 'a') snakeGame.input('LEFT');
                if (e.key === 'ArrowRight' || e.key === 'd') snakeGame.input('RIGHT');
            } else if (currentGame === 'breakout') {
                if (e.key === 'ArrowLeft' || e.key === 'a') breakoutGame.input('LEFT', true);
                if (e.key === 'ArrowRight' || e.key === 'd') breakoutGame.input('RIGHT', true);
            } else if (currentGame === 'flappy') {
                if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w') {
                    flappyGame.flap();
                }
            }
        });

        window.addEventListener('keyup', e => {
            if (currentGame === 'breakout') {
                if (e.key === 'ArrowLeft' || e.key === 'a') breakoutGame.input('LEFT', false);
                if (e.key === 'ArrowRight' || e.key === 'd') breakoutGame.input('RIGHT', false);
            }
        });

        // MAIN ANIMATION LOOP
        let last = performance.now();
        function loop(now) {
            const dt = Math.min((now - last) / 1000, 0.1);
            last = now;

            if (currentGame === 'snake') {
                snakeGame.update(dt);
                snakeGame.draw();
            } else if (currentGame === 'breakout') {
                breakoutGame.update(dt);
                breakoutGame.draw();
            } else if (currentGame === 'flappy') {
                flappyGame.update(dt);
                flappyGame.draw();
            } else {
                bmoIdle.update(dt);
                bmoIdle.draw();
            }

            requestAnimationFrame(loop);
        }
        loop(performance.now());
    })();
    </script>
</body>
